name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: corepack enable
      - run: contracts/scripts/check.sh
      - name: build both packages
        working-directory: contracts
        run: |
          uv build
          pnpm pack

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # every storage adapter must be proven here; a skipped adapter fails the job
      REQUIRE_STORAGE_TESTS: "1"
      TEST_DATABASE_URL: postgresql+asyncpg://keitaro:keitaro@127.0.0.1:55432/keitaro_test
      TEST_MONGO_URL: mongodb://127.0.0.1:57017/?directConnection=true
    steps:
      - uses: actions/checkout@v7
      # the same test databases a developer starts locally
      - run: docker compose -f ../compose.yaml --profile test up -d --wait db-test mongo-test
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      # operation types must match the documents and the contract
      - run: pnpm codegen && git diff --exit-code -- server/graphql/operations.ts
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks detect --redact --no-banner
