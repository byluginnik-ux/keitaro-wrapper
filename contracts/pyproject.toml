[project]
name = "keitaro-wrapper-contracts"
dynamic = ["version"]
description = "GraphQL contract of Keitaro Wrapper: the schema and Strawberry types generated from it"
requires-python = ">=3.13"
dependencies = [
    "strawberry-graphql>=0.250",
]

[dependency-groups]
dev = [
    "pyright>=1.1.390",
    "pytest>=8.3",
    "ruff>=0.8",
    "strawberry-graphql[cli]>=0.250",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "VERSION"
pattern = "(?P<version>.+)"

[tool.hatch.build.targets.wheel]
packages = ["keitaro_contracts"]

[tool.hatch.build.targets.wheel.force-include]
"schema.graphql" = "keitaro_contracts/schema.graphql"

[tool.hatch.build.targets.sdist]
include = ["keitaro_contracts", "schema.graphql", "VERSION", "CHANGELOG.md", "README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config -ra"

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = [".agents", "node_modules"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D100", "D101", "D102", "D104", "D107",  # docstrings are required for public functions only
    "D203", "D213",                          # pick one docstring style
    "COM812", "ISC001",                      # conflict with the formatter
    "RUF001", "RUF002", "RUF003",            # Cyrillic in strings, docstrings and comments is intended
    "CPY",                                   # no copyright headers
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "D", "PLR2004"]
"scripts/**" = ["S603", "S607", "T201", "INP001"]
"keitaro_contracts/types.py" = ["ALL"]       # generated, formatted only

[tool.pyright]
include = ["keitaro_contracts", "tests", "scripts"]
typeCheckingMode = "strict"
pythonVersion = "3.13"
