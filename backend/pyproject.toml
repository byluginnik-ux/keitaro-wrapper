[project]
name = "keitaro-wrapper-backend"
version = "0.1.0"
description = "GraphQL backend for the Keitaro campaign creator and offer editor"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.28",
    "pydantic>=2.10",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "anyio>=4.6",
    "httpx>=0.28",
    "hypothesis>=6.170.15",
    "pyright>=1.1.390",
    "pytest>=8.3",
    "respx>=0.23.1",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config -ra"
xfail_strict = true

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = [".agents"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D100", "D101", "D102", "D104", "D107",  # docstrings are required for public functions only
    "D203", "D213",                          # pick one docstring style
    "COM812", "ISC001",              # conflict with the formatter
    "RUF001", "RUF002", "RUF003",    # Cyrillic in strings, docstrings and comments is intended
    "CPY",                           # no copyright headers
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "D", "PLR2004"]

[tool.pyright]
include = ["app", "tests"]
typeCheckingMode = "strict"
pythonVersion = "3.13"
reportMissingTypeStubs = "error"
