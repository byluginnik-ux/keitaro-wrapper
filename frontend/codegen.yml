# Types of our own operations, generated from the schema of the contracts package.
schema: node_modules/@keitaro-wrapper/contracts/schema.graphql
documents: server/graphql/**/*.graphql
generates:
  server/graphql/operations.ts:
    plugins:
      - add:
          content: "// GENERATED by `pnpm codegen` from server/graphql/*.graphql — do not edit by hand."
      - typescript-operations
      - typed-document-node
    config:
      useTypeImports: true
      enumsAsTypes: true
      skipTypename: true
      scalars:
        ID: string
