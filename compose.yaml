# Наружу открыт только фронт. Бэкенд доступен BFF по внутренней сети (R-ARCH-04).
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      STORAGE_BACKEND: ${STORAGE_BACKEND:-postgres}
      DATABASE_URL: postgresql+asyncpg://keitaro:keitaro@db:5432/keitaro
      MONGO_URL: mongodb://mongo:27017/?directConnection=true
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Применяет миграции Alembic перед стартом бэкенда и завершается.
  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["/srv/backend/.venv/bin/alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+asyncpg://keitaro:keitaro@db:5432/keitaro
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: keitaro
      POSTGRES_PASSWORD: keitaro
      POSTGRES_DB: keitaro
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "keitaro"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Нужен только при STORAGE_BACKEND=mongo: docker compose --profile mongo up
  mongo:
    image: mongo:8
    profiles: [mongo]
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongo-data:/data/db
    healthcheck: &mongo-health
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "try { rs.status().ok } catch (e) { rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'localhost:27017'}]}).ok }"
      interval: 3s
      timeout: 5s
      retries: 20

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      NUXT_BACKEND_GRAPHQL_URL: http://backend:8000/graphql
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy

  # Базы для контрактных тестов хранилища: docker compose --profile test up -d
  db-test:
    image: postgres:17-alpine
    profiles: [test]
    environment:
      POSTGRES_USER: keitaro
      POSTGRES_PASSWORD: keitaro
      POSTGRES_DB: keitaro_test
    ports:
      - "127.0.0.1:${TEST_POSTGRES_PORT:-55432}:5432"
    tmpfs:
      - /var/lib/postgresql/data

  # Один узел в режиме replica set: транзакциям MongoDB он нужен обязательно.
  mongo-test:
    image: mongo:8
    profiles: [test]
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "127.0.0.1:${TEST_MONGO_PORT:-57017}:27017"
    tmpfs:
      - /data/db
    healthcheck: *mongo-health

  rabbitmq-test:
    image: rabbitmq:4-alpine
    profiles: [test]
    ports:
      - "127.0.0.1:${TEST_RABBITMQ_PORT:-55672}:5672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 3s
      timeout: 5s
      retries: 30

volumes:
  db-data:
  mongo-data:
